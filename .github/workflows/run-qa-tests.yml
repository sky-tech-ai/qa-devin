name: Run QA Tests

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Comma-separated test names to run (leave empty for all tests)'
        required: false
        default: ''
        type: string
      environment:
        description: 'Environment (selects basic auth and Devin secrets)'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
      url:
        description: 'Base URL for testing'
        required: false
        default: 'https://dev.app.sky-tech.ai/'
        type: string
      external_api_specs_url:
        description: 'URL for external API specs'
        required: false
        default: 'https://dev-api.app.sky-tech.ai/external-api/docs-json'
        type: string
      sample_pdf_url:
        description: 'URL for sample PDF document'
        required: false
        default: 'https://pdfobject.com/pdf/sample.pdf'
        type: string
      johndoejunior_zip_url:
        description: 'URL for John Doe Junior zip archive'
        required: false
        default: 'https://dev-assets.app.sky-tech.ai/previews/John_Doe_Junior.zip'
        type: string

jobs:
  run-qa-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run QA tests
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TESTS: ${{ inputs.tests }}
        run: |
          args=(--environment "${{ inputs.environment }}" --url "${{ inputs.url }}"
            --external-api-specs-url "${{ inputs.external_api_specs_url }}"
            --sample-pdf-url "${{ inputs.sample_pdf_url }}"
            --johndoejunior-zip-url "${{ inputs.johndoejunior_zip_url }}")
          if [ -n "$TESTS" ]; then args+=(--tests "$TESTS"); fi
          python3 run_qa_devin.py "${args[@]}"
